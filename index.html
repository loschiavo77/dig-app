<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG - Diabetes Intelligence Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen p-4 max-w-md mx-auto justify-between">

    <div class="w-full flex-grow flex flex-col justify-between">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <h1 class="text-2xl font-black text-emerald-400 tracking-wider">D.I.G.</h1>
            <span id="last-sync" class="text-xs text-slate-500 font-mono">In attesa di xDrip+...</span>
        </div>

        <div class="my-auto text-center py-6">
            <div class="text-slate-500 text-xs uppercase tracking-widest font-bold mb-1">Glicemia Attuale</div>
            <div class="flex justify-center items-baseline gap-2">
                <span id="bg-value" class="text-8xl font-black tracking-tighter text-slate-100">--</span>
                <span id="bg-trend" class="text-4xl text-emerald-400 font-bold">→</span>
            </div>
            <div id="alert-box" class="mt-4 p-2 rounded bg-red-950/40 border border-red-500/50 text-red-400 text-sm font-bold hidden animate-pulse">
                ATTENZIONE!
            </div>
        </div>

        <div class="bg-slate-900/50 border border-slate-800/80 rounded-xl p-4 mb-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Andamento Recente</h3>
            <div id="history-list" class="flex justify-between items-end h-20 px-2 font-mono text-xs">
                </div>
        </div>

        <div class="bg-slate-900/50 border border-slate-800/80 rounded-xl p-4 flex flex-col h-64 justify-between">
            <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2 border-b border-slate-800 pb-1 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> DIG Assistant
            </h3>
            
            <div id="chat-messages" class="flex-grow overflow-y-auto space-y-2 mb-3 text-sm flex flex-col pr-1">
                <div class="bg-slate-900 p-3 rounded-lg max-w-[85%] border border-slate-800 text-slate-300">
                    Ciao! Sono DIG. Leggo i tuoi dati reali da xDrip+. Come posso aiutarti oggi?
                </div>
            </div>

            <div class="flex gap-2">
                <input id="chat-input" type="text" placeholder="Chiedi a DIG..." class="flex-grow bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-200">
                <button onclick="sendMessage()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition-all">Invia</button>
            </div>
        </div>
    </div>

    <script>
        let bgHistory = [];

        async function fetchCareLinkData() {
            document.getElementById('last-sync').innerText = "Sincronizzazione...";
            try {
                // Legge i dati reali trasmessi da xDrip+ sul telefono
                const response = await fetch('http://127.0.0.1:17580/sgv.json?count=12');
                const data = await response.json();
                
                if (data && data.length > 0) {
                    bgHistory = data.map(item => {
                        let date = new Date(item.date);
                        let timeStr = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                        let trendWord = "FLAT";
                        if (item.direction === "DoubleUp" || item.direction === "SingleUp" || item.direction === "FortyFiveUp") trendWord = "UP";
                        if (item.direction === "DoubleDown" || item.direction === "SingleDown" || item.direction === "FortyFiveDown") trendWord = "DOWN";
                        
                        return {
                            time: timeStr,
                            value: item.sgv,
                            trend: trendWord
                        };
                    }).reverse();

                    localStorage.setItem('dig_bgHistory', JSON.stringify(bgHistory));
                    
                    const latestBg = bgHistory[bgHistory.length - 1].value;
                    if (latestBg < 70) triggerAlert(`IPOGLICEMIA: ${latestBg} mg/dL!`);
                    else if (latestBg > 180) triggerAlert(`IPERGLICEMIA: ${latestBg} mg/dL!`);
                    else silenceAlarm();

                    updateUI();
                    let oraAttuale = new Date();
                    document.getElementById('last-sync').innerText = `Sincronizzato: ${String(oraAttuale.getHours()).padStart(2,'0')}:${String(oraAttuale.getMinutes()).padStart(2,'0')}`;
                }
            } catch (err) {
                document.getElementById('last-sync').innerText = "In attesa di xDrip+...";
            }
        }

        function updateUI() {
            if (bgHistory.length === 0) return;

            const current = bgHistory[bgHistory.length - 1];
            document.getElementById('bg-value').innerText = current.value;
            
            // Imposta freccia trend
            let arrow = "→";
            if (current.trend === "UP") arrow = "↑";
            if (current.trend === "DOWN") arrow = "↓";
            document.getElementById('bg-trend').innerText = arrow;

            // Disegna storico semplificato
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            const lastSix = bgHistory.slice(-6);
            lastSix.forEach(item => {
                historyList.innerHTML += `
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-[10px] text-slate-500">${item.time}</span>
                        <div class="w-8 bg-slate-800 rounded flex items-center justify-center py-1 text-slate-300 font-bold border border-slate-700/50">
                            ${item.value}
                        </div>
                    </div>
                `;
            });
        }

        function triggerAlert(message) {
            const box = document.getElementById('alert-box');
            box.innerText = message;
            box.classList.remove('hidden');
        }

        function silenceAlarm() {
            document.getElementById('alert-box').classList.add('hidden');
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const userText = input.value.trim();
            if(!userText) return;

            const chatContainer = document.getElementById('chat-messages');
            chatContainer.innerHTML += `
                <div class="bg-emerald-500 text-slate-950 p-2.5 rounded-lg max-w-[85%] self-end ml-auto border border-emerald-400 font-semibold">
                    ${userText}
                </div>
            `;

            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Risposte simulate temporanee
            setTimeout(() => {
                let currentBg = bgHistory.length > 0 ? bgHistory[bgHistory.length - 1].value : "--";
                let reply = `Ho ricevuto il messaggio! La tua glicemia attuale rilevata da xDrip+ è di ${currentBg} mg/dL.`;
                
                chatContainer.innerHTML += `
                    <div class="bg-slate-900 p-2.5 rounded-lg max-w-[85%] border border-slate-800">
                        ${reply}
                    </div>
                `;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);
        }

        // Avvio automatico e aggiornamento ogni minuto
        fetchCareLinkData();
        setInterval(fetchCareLinkData, 60000);
    </script>
</body>
</html>
