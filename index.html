<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG - Diabetes Intelligence Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; flex-grow: 1; }
        /* Stile personalizzato per la barra di scorrimento dell'archivio */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen p-4 max-w-md mx-auto">

    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
        <h1 class="text-2xl font-black text-emerald-400 tracking-wider">D.I.G.</h1>
        <span id="last-sync" class="text-xs text-slate-500 font-mono">In attesa...</span>
    </div>

    <div id="tab-archive" class="tab-content justify-between">
        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4 flex flex-col h-[68vh]">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 pb-1 border-b border-slate-800">
                Archivio Storico Glicemie
            </h3>
            <div id="archive-list" class="flex-grow overflow-y-auto space-y-4 pr-1">
                <div class="text-slate-500 text-xs italic text-center py-4">Caricamento dati storici...</div>
            </div>
        </div>
    </div>

    <div id="tab-home" class="tab-content active justify-between">
        <div class="flex justify-between items-center bg-slate-900/30 border border-slate-800/60 p-4 rounded-2xl">
            <div class="text-left">
                <div class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">Glicemia</div>
                <div class="flex items-baseline gap-1">
                    <span id="bg-value" class="text-6xl font-black tracking-tighter text-slate-100">--</span>
                    <span id="bg-trend" class="text-2xl text-emerald-400 font-bold">→</span>
                </div>
            </div>
            
            <div class="text-right border-l border-slate-800 pl-4">
                <div class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">TIR (24h)</div>
                <div class="text-3xl font-black text-emerald-400 font-mono" id="tir-value">--%</div>
                <span class="text-[9px] text-slate-500">Target: 70-180 mg/dL</span>
            </div>
        </div>

        <div id="alert-box" class="mt-3 p-2 rounded bg-red-950/40 border border-red-500/50 text-red-400 text-xs font-bold hidden animate-pulse text-center">
            ATTENZIONE!
        </div>

        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 my-3 flex-grow flex flex-col justify-center min-h-[220px]">
            <canvas id="bgChart"></canvas>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-2">
            <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 text-center flex flex-col justify-between">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-500 tracking-wider block">Scadenza Sensore</span>
                    <span id="sensor-timer" class="text-sm font-black text-emerald-400 font-mono block mt-1">--</span>
                </div>
                <button onclick="promptManualTimer('sensor')" class="text-[9px] text-slate-400 hover:text-slate-200 mt-2 bg-slate-950 border border-slate-800 py-1.5 rounded font-bold">Modifica</button>
            </div>
            <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 text-center flex flex-col justify-between">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-500 tracking-wider block">Scadenza Set</span>
                    <span id="set-timer" class="text-sm font-black text-emerald-400 font-mono block mt-1">--</span>
                </div>
                <button onclick="promptManualTimer('set')" class="text-[9px] text-slate-400 hover:text-slate-200 mt-2 bg-slate-950 border border-slate-800 py-1.5 rounded font-bold">Modifica</button>
            </div>
        </div>
    </div>

    <div id="tab-chat" class="tab-content justify-between h-[68vh]">
        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4 flex flex-col h-full justify-between">
            <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2 border-b border-slate-800 pb-1 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> DIG Assistant
            </h3>
            <div id="chat-messages" class="flex-grow overflow-y-auto space-y-2 mb-3 text-sm flex flex-col pr-1">
                <div class="bg-slate-900 p-3 rounded-lg max-w-[85%] border border-slate-800 text-slate-300">
                    Ciao! Sono DIG. Leggo i tuoi dati reali da xDrip+. Chiedimi pure consiglio!
                </div>
            </div>
            <div class="flex gap-2">
                <input id="chat-input" type="text" placeholder="Chiedi a DIG..." class="flex-grow bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-200">
                <button onclick="sendMessage()" class="bg-emerald-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm">Invia</button>
            </div>
        </div>
    </div>

    <div class="flex justify-around border-t border-slate-800 pt-3 mt-auto bg-slate-950/80 p-2 rounded-xl">
        <button onclick="switchTab('archive')" class="nav-btn text-slate-500 font-bold text-sm">Archivio</button>
        <button onclick="switchTab('home')" class="nav-btn text-emerald-400 font-bold text-sm">Home</button>
        <button onclick="switchTab('chat')" class="nav-btn text-slate-500 font-bold text-sm">Chat Assistant</button>
    </div>

    <script>
        let bgHistory = [];
        let chartInstance = null;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('text-emerald-400'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.add('text-slate-500'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.remove('text-slate-500');
            event.target.classList.add('text-emerald-400');
        }

        async function fetchCareLinkData() {
            document.getElementById('last-sync').innerText = "Sincronizzazione...";
            try {
                // Leggiamo fino a 288 record per coprire l'intera giornata e oltre
                const response = await fetch('http://127.0.0.1:17580/sgv.json?count=288');
                const data = await response.json();
                
                if (data && data.length > 0) {
                    bgHistory = data.map(item => {
                        let date = new Date(item.date);
                        let dateStr = `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
                        let timeStr = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                        let trendWord = "FLAT";
                        if (item.direction === "DoubleUp" || item.direction === "SingleUp" || item.direction === "FortyFiveUp") trendWord = "UP";
                        if (item.direction === "DoubleDown" || item.direction === "SingleDown" || item.direction === "FortyFiveDown") trendWord = "DOWN";
                        
                        return { date: dateStr, time: timeStr, value: item.sgv, trend: trendWord, rawDate: date };
                    }).reverse();

                    localStorage.setItem('dig_bgHistory', JSON.stringify(bgHistory));
                    
                    const latestBg = bgHistory[bgHistory.length - 1].value;
                    if (latestBg < 70) triggerAlert(`IPOGLICEMIA: ${latestBg} mg/dL!`);
                    else if (latestBg > 180) triggerAlert(`IPERGLICEMIA: ${latestBg} mg/dL!`);
                    else silenceAlarm();

                    updateUI();
                    let oraAttuale = new Date();
                    document.getElementById('last-sync').innerText = `Aggiornato: ${String(oraAttuale.getHours()).padStart(2,'0')}:${String(oraAttuale.getMinutes()).padStart(2,'0')}`;
                }
            } catch (err) {
                document.getElementById('last-sync').innerText = "In attesa di xDrip+...";
            }
        }

        function updateUI() {
            if (bgHistory.length === 0) return;

            // 1. Glicemia Attuale
            const current = bgHistory[bgHistory.length - 1];
            document.getElementById('bg-value').innerText = current.value;
            
            let arrow = "→";
            if (current.trend === "UP") arrow = "↑";
            if (current.trend === "DOWN") arrow = "↓";
            document.getElementById('bg-trend').innerText = arrow;

            // 2. Calcolo TIR
            const inRange = bgHistory.filter(item => item.value >= 70 && item.value <= 180).length;
            const tir = bgHistory.length > 0 ? Math.round((inRange / bgHistory.length) * 100) : 0;
            const tirElement = document.getElementById('tir-value');
            tirElement.innerText = `${tir}%`;
            
            if (tir >= 70) { tirElement.className = "text-3xl font-black text-emerald-400 font-mono"; }
            else if (tir >= 50) { tirElement.className = "text-3xl font-black text-yellow-500 font-mono"; }
            else { tirElement.className = "text-3xl font-black text-red-500 font-mono"; }

            // 3. Archivio Diviso per Giorni (Raggruppamento)
            const archiveList = document.getElementById('archive-list');
            archiveList.innerHTML = '';
            
            // Raggruppiamo i dati storici per data
            const groupedData = {};
            const archiveSorted = [...bgHistory].reverse();
            
            archiveSorted.forEach(item => {
                // Formatta in modo carino la data (es. "Oggi", "Ieri" o "17/07/2026")
                let label = item.date;
                const today = new Date();
                const yesterday = new Date();
                yesterday.setDate(today.getDate() - 1);
                
                const itemDateObj = new Date(item.rawDate);
                if (itemDateObj.toDateString() === today.toDateString()) {
                    label = "Oggi";
                } else if (itemDateObj.toDateString() === yesterday.toDateString()) {
                    label = "Ieri";
                } else {
                    label = item.date.substring(0, 5); // Esclude l'anno per renderlo compatto
                }

                if (!groupedData[label]) {
                    groupedData[label] = [];
                }
                groupedData[label].push(item);
            });

            // Creazione elementi HTML raggruppati
            for (const [giorno, letture] of Object.entries(groupedData)) {
                let groupHTML = `
                    <div class="bg-slate-950/40 border border-slate-800/50 rounded-lg p-3">
                        <h4 class="text-xs font-bold text-emerald-400/90 mb-2 border-b border-slate-800 pb-1">${giorno}</h4>
                        <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                `;
                
                letture.forEach(item => {
                    let colorClass = "text-emerald-400";
                    if (item.value < 70) colorClass = "text-red-400 font-bold";
                    if (item.value > 180) colorClass = "text-yellow-500 font-bold";

                    groupHTML += `
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-500">${item.time}</span>
                            <span class="${colorClass}">${item.value} mg/dL</span>
                        </div>
                    `;
                });

                groupHTML += `</div></div>`;
                archiveList.innerHTML += groupHTML;
            }

            // 4. Grafico a Linee con Linee Limite Orizzontali (70 e 180)
            const ctx = document.getElementById('bgChart').getContext('2d');
            const recentHistory = bgHistory.slice(-24); // Ultime 2 ore circa
            const labels = recentHistory.map(item => item.time);
            const values = recentHistory.map(item => item.value);

            if (chartInstance) {
                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = values;
                chartInstance.update();
            } else {
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Glicemia',
                            data: values,
                            borderColor: '#ffffff',
                            borderWidth: 3,
                            pointBackgroundColor: values.map(val => val < 70 ? '#ef4444' : val > 180 ? '#f59e0b' : '#10b981'),
                            pointBorderColor: '#020617',
                            pointBorderWidth: 1.5,
                            pointRadius: 4.5,
                            pointHoverRadius: 7,
                            tension: 0.25,
                            fill: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { 
                            legend: { display: false },
                            tooltip: {
                                enabled: true,
                                backgroundColor: '#0f172a',
                                titleColor: '#94a3b8',
                                bodyColor: '#ffffff',
                                bodyFont: { weight: 'bold', size: 13 },
                                displayColors: false,
                                callbacks: {
                                    label: function(context) {
                                        return `Glicemia: ${context.raw} mg/dL alle ore ${context.label}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: { 
                                min: 40,
                                max: 250,
                                grid: { color: 'rgba(30, 41, 59, 0.5)' }, 
                                ticks: { color: '#94a3b8', stepSize: 30 } 
                            },
                            x: { 
                                grid: { display: false }, 
                                ticks: { color: '#94a3b8', maxTicksLimit: 6 } 
                            }
                        }
                    },
                    plugins: [{
                        id: 'customChartEnhancements',
                        // Disegna le linee orizzontali dei limiti
                        afterDraw: function(chart) {
                            const ctx = chart.ctx;
                            const yAxis = chart.scales.y;
                            const xAxis = chart.scales.x;
                            
                            // Linea 180 (Iper)
                            const pixel180 = yAxis.getPixelForValue(180);
                            ctx.save();
                            ctx.beginPath();
                            ctx.setLineDash([5, 5]);
                            ctx.strokeStyle = 'rgba(245, 158, 11, 0.45)';
                            ctx.lineWidth = 1.5;
                            ctx.moveTo(xAxis.left, pixel180);
                            ctx.lineTo(xAxis.right, pixel180);
                            ctx.stroke();
                            
                            // Linea 70 (Ipo)
                            const pixel70 = yAxis.getPixelForValue(70);
                            ctx.beginPath();
                            ctx.strokeStyle = 'rgba(239, 68, 68, 0.45)';
                            ctx.moveTo(xAxis.left, pixel70);
                            ctx.lineTo(xAxis.right, pixel70);
                            ctx.stroke();
                            ctx.restore();
                        },
                        // Sfondo sfumato delle aree
                        beforeDraw: function(chart) {
                            const ctx = chart.ctx;
                            const yAxis = chart.scales.y;
                            const xAxis = chart.scales.x;
                            
                            const y180 = yAxis.getPixelForValue(180);
                            const y70 = yAxis.getPixelForValue(70);
                            const yMin = yAxis.getPixelForValue(yAxis.min);
                            const yMax = yAxis.getPixelForValue(yAxis.max);

                            // Sfondo Iper (Giallo/Rosso molto soffuso)
                            ctx.fillStyle = 'rgba(239, 68, 68, 0.04)';
                            ctx.fillRect(xAxis.left, yMax, xAxis.right - xAxis.left, y180 - yMax);

                            // Sfondo Target (Verde sano)
                            ctx.fillStyle = 'rgba(16, 185, 129, 0.05)';
                            ctx.fillRect(xAxis.left, y180, xAxis.right - xAxis.left, y70 - y180);

                            // Sfondo Ipo (Rosso allarme)
                            ctx.fillStyle = 'rgba(239, 68, 68, 0.07)';
                            ctx.fillRect(xAxis.left, y70, xAxis.right - xAxis.left, yMin - y70);
                        }
                    }]
                });
            }
        }

        // --- Gestione Timer Modificabile Manualmente ---
        function promptManualTimer(type) {
            const currentLabel = type === 'sensor' ? 'SENSORE (es. 10)' : 'SET DI INFUSIONE (es. 3)';
            const inputGiorni = prompt(`Quanti GIORNI deve durare il nuovo timer del ${currentLabel}?`, type === 'sensor' ? "10" : "3");
            
            if (inputGiorni === null) return; // Annullato
            
            const giorni = parseFloat(inputGiorni);
            if (isNaN(giorni) || giorni < 0) {
                alert("Per favore, inserisci un numero di giorni valido.");
                return;
            }

            const inputOre = prompt(`Aggiungi eventuali ORE extra (opzionale):`, "0");
            const ore = parseFloat(inputOre) || 0;

            const durationMs = (giorni * 24 * 60 * 60 * 1000) + (ore * 60 * 60 * 1000);
            const expirationTime = Date.now() + durationMs;
            
            localStorage.setItem(`dig_expire_${type}`, expirationTime);
            updateTimers();
        }

        function updateTimers() {
            ['sensor', 'set'].forEach(type => {
                const expire = localStorage.getItem(`dig_expire_${type}`);
                if (!expire) {
                    document.getElementById(`${type}-timer`).innerText = "Non impostato";
                    document.getElementById(`${type}-timer`).className = "text-sm font-black text-slate-500 font-mono block mt-1";
                    return;
                }

                const diff = expire - Date.now();
                if (diff <= 0) {
                    document.getElementById(`${type}-timer`).innerText = "SCADUTO!";
                    document.getElementById(`${type}-timer`).className = "text-sm font-black text-red-500 font-mono block mt-1 animate-pulse";
                } else {
                    const days = Math.floor(diff / (24 * 60 * 60 * 1000));
                    const hours = Math.floor((diff % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
                    const mins = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
                    
                    document.getElementById(`${type}-timer`).innerText = `${days}g ${hours}o ${mins}m`;
                    
                    if (diff < (24 * 60 * 60 * 1000)) {
                        document.getElementById(`${type}-timer`).className = "text-sm font-black text-yellow-500 font-mono block mt-1";
                    } else {
                        document.getElementById(`${type}-timer`).className = "text-sm font-black text-emerald-400 font-mono block mt-1";
                    }
                }
            });
        }

        function triggerAlert(message) {
            const box = document.getElementById('alert-box');
            box.innerText = message;
            box.classList.remove('hidden');
        }

        function silenceAlarm() {
            document.getElementById('alert-box').classList.add('hidden');
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const userText = input.value.trim();
            if(!userText) return;

            const chatContainer = document.getElementById('chat-messages');
            chatContainer.innerHTML += `<div class="bg-emerald-500 text-slate-950 p-2.5 rounded-lg max-w-[85%] self-end ml-auto font-semibold">${userText}</div>`;
            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            setTimeout(() => {
                let currentBg = bgHistory.length > 0 ? bgHistory[bgHistory.length - 1].value : "--";
                let reply = `Dato letto da xDrip+: ${currentBg} mg/dL. Come posso aiutarti a gestire questo valore?`;
                chatContainer.innerHTML += `<div class="bg-slate-900 p-2.5 rounded-lg max-w-[85%] border border-slate-800">${reply}</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);
        }

        fetchCareLinkData();
        setInterval(fetchCareLinkData, 60000);
        
        updateTimers();
        setInterval(updateTimers, 60000);
    </script>
</body>
</html>
