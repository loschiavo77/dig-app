<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG - Diabetes Intelligence Guide</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22DIG%22,%22short_name%22:%22DIG%22,%22start_url%22:%22/%22,%22id%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23020617%22,%22theme_color%22:%22%23020617%22}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; flex-grow: 1; }
        .subtab-content { display: none; }
        .subtab-content.active { display: block; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.3); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        
        #chart-container {
            position: relative;
            width: 100%;
            height: 340px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen p-3 max-w-md mx-auto">

    <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-3">
        <h1 class="text-2xl font-black text-emerald-400 tracking-wider">D.I.G.</h1>
        <span id="last-sync" class="text-xs text-slate-500 font-mono">In attesa...</span>
    </div>

    <div id="tab-cho" class="tab-content justify-between">
        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 flex flex-col h-[75vh]">
            <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-3 pb-2 border-b border-slate-800">
                🥗 Diario & Tabella Carboidrati
            </h3>
            
            <div class="grid grid-cols-5 gap-2 mb-3">
                <input id="cho-food" type="text" placeholder="Cibo (es. Pane)" class="col-span-3 bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                <input id="cho-val" type="number" placeholder="CHO /100g" class="col-span-2 bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
            </div>
            <button onclick="addCarbItem()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-1.5 rounded text-xs mb-3">
                + Aggiungi alla Tabella
            </button>

            <div class="flex-grow overflow-y-auto pr-1">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-950 text-slate-400 border-b border-slate-800 sticky top-0">
                        <tr>
                            <th class="p-2">Alimento</th>
                            <th class="p-2 text-right">g CHO / 100g</th>
                            <th class="p-2 text-center"></th>
                        </tr>
                    </thead>
                    <tbody id="cho-table-body" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="tab-home" class="tab-content active justify-between">
        <div class="flex justify-between items-center bg-slate-900/30 border border-slate-800/60 p-3 rounded-2xl">
            <div class="text-left">
                <div class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">Glicemia</div>
                <div class="flex items-baseline gap-1">
                    <span id="bg-value" class="text-5xl font-black tracking-tighter text-slate-100">--</span>
                    <span id="bg-trend" class="text-2xl text-emerald-400 font-bold">→</span>
                </div>
            </div>
            
            <div class="text-right border-l border-slate-800 pl-4">
                <div class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">TIR (24 Ore)</div>
                <div class="text-3xl font-black text-emerald-400 font-mono" id="tir-value">--%</div>
                <span class="text-[9px] text-slate-500">Target: 70-180 mg/dL</span>
            </div>
        </div>

        <div id="alert-box" class="mt-2 p-2 rounded bg-red-950/50 border border-red-500 text-red-400 text-xs font-bold hidden animate-pulse text-center"></div>

        <div class="flex justify-between items-center px-2 mt-2">
            <span class="text-[11px] text-slate-400 font-bold uppercase tracking-wider">Insulina attiva (IOB):</span>
            <span id="iob-value" class="text-lg font-black text-emerald-400 font-mono">-- U</span>
        </div>

        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-2 my-2 flex-grow flex flex-col justify-center relative">
            <div id="chart-container">
                <canvas id="bgChart"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-1">
            <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-2 text-center flex flex-col justify-between">
                <div>
                    <span class="text-[9px] uppercase font-bold text-slate-500 tracking-wider block">Scadenza Sensore</span>
                    <span id="sensor-timer" class="text-xs font-black text-emerald-400 font-mono block mt-0.5">--</span>
                </div>
                <div class="flex gap-1 mt-1">
                    <button onclick="resetTimerQuick('sensor', 7)" class="flex-1 text-[9px] text-emerald-400 bg-emerald-950/40 border border-emerald-800/60 py-1 rounded font-bold hover:bg-emerald-900/50">+7G</button>
                    <button onclick="promptManualTimer('sensor')" class="text-[9px] text-slate-400 bg-slate-950 border border-slate-800 px-1.5 py-1 rounded font-bold">⚙️</button>
                </div>
            </div>

            <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-2 text-center flex flex-col justify-between">
                <div>
                    <span class="text-[9px] uppercase font-bold text-slate-500 tracking-wider block">Scadenza Set</span>
                    <span id="set-timer" class="text-xs font-black text-emerald-400 font-mono block mt-0.5">--</span>
                </div>
                <div class="flex gap-1 mt-1">
                    <button onclick="resetTimerQuick('set', 3)" class="flex-1 text-[9px] text-emerald-400 bg-emerald-950/40 border border-emerald-800/60 py-1 rounded font-bold hover:bg-emerald-900/50">+3G</button>
                    <button onclick="promptManualTimer('set')" class="text-[9px] text-slate-400 bg-slate-950 border border-slate-800 px-1.5 py-1 rounded font-bold">⚙️</button>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-notes" class="tab-content justify-between">
        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 flex flex-col h-[75vh]">
            <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2 border-b border-slate-800 pb-2">
                📚 Appunti & Studio Diabetologia
            </h3>

            <div class="flex bg-slate-950 rounded-lg p-1 border border-slate-800 mb-3 text-[10px] font-bold">
                <button onclick="switchSubTab('medica')" id="btn-sub-medica" class="flex-1 py-1 rounded text-emerald-400 bg-slate-800">Medica</button>
                <button onclick="switchSubTab('tecnologica')" id="btn-sub-tecnologica" class="flex-1 py-1 rounded text-slate-400">Tecnologia</button>
                <button onclick="switchSubTab('glossario')" id="btn-sub-glossario" class="flex-1 py-1 rounded text-slate-400">Glossario EN/IT</button>
            </div>

            <div id="subtab-medica" class="subtab-content active flex-grow flex flex-col">
                <textarea id="notes-medica" placeholder="Scrivi qui i tuoi appunti medici..." class="w-full flex-grow bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 resize-none" oninput="saveNotes('medica')"></textarea>
            </div>

            <div id="subtab-tecnologica" class="subtab-content flex-grow flex flex-col">
                <textarea id="notes-tecnologica" placeholder="Scrivi qui i tuoi appunti tecnologici..." class="w-full flex-grow bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 resize-none" oninput="saveNotes('tecnologica')"></textarea>
            </div>

            <div id="subtab-glossario" class="subtab-content flex-grow flex flex-col">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input id="gloss-term" type="text" placeholder="Termine EN/IT" class="bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                    <input id="gloss-trans" type="text" placeholder="Traduzione" class="bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="addGlossaryTerm()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-1.5 rounded text-xs mb-3">
                    + Salva Termine Glossario
                </button>

                <div class="flex-grow overflow-y-auto border border-slate-800/80 rounded bg-slate-950/40 p-2">
                    <div id="glossary-list" class="space-y-1.5"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="flex justify-around border-t border-slate-800 pt-2 mt-auto bg-slate-950/90 p-2 rounded-xl">
        <button onclick="switchTab('cho')" class="nav-btn text-slate-500 font-bold text-xs flex flex-col items-center gap-1">
            <span>🥗</span> Carboidrati
        </button>
        <button onclick="switchTab('home')" class="nav-btn text-emerald-400 font-bold text-xs flex flex-col items-center gap-1">
            <span>📈</span> Home
        </button>
        <button onclick="switchTab('notes')" class="nav-btn text-slate-500 font-bold text-xs flex flex-col items-center gap-1">
            <span>📚</span> Appunti Studio
        </button>
    </div>

    <script>
        let bgHistory = [];
        let chartInstance = null;
        let hasUserScrolled = false;
        let isFetching = false;

        let choList = JSON.parse(localStorage.getItem('dig_cho_list')) || [];
        let glossaryList = JSON.parse(localStorage.getItem('dig_glossary_list')) || [];

        try {
            const cachedHistory = localStorage.getItem('dig_bgHistory');
            if (cachedHistory) bgHistory = JSON.parse(cachedHistory);
        } catch(e) {}

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-emerald-400');
                el.classList.add('text-slate-500');
            });
            
            document.getElementById('tab-' + tabName).classList.add('active');
            if(window.event && window.event.currentTarget) {
                window.event.currentTarget.classList.remove('text-slate-500');
                window.event.currentTarget.classList.add('text-emerald-400');
            }

            if (tabName === 'home' && chartInstance) {
                setTimeout(() => {
                    hasUserScrolled = false;
                    const totalPoints = chartInstance.data.labels.length;
                    if (totalPoints > 0) {
                        chartInstance.scales.x.options.min = Math.max(0, totalPoints - 48);
                        chartInstance.scales.x.options.max = totalPoints - 1;
                        chartInstance.update('none');
                    }
                }, 50);
            }
        }

        function switchSubTab(subTabName) {
            document.querySelectorAll('.subtab-content').forEach(el => el.classList.remove('active'));
            ['medica', 'tecnologica', 'glossario'].forEach(name => {
                const btn = document.getElementById(`btn-sub-${name}`);
                btn.className = "flex-1 py-1 rounded text-slate-400";
            });

            document.getElementById(`subtab-${subTabName}`).classList.add('active');
            const activeBtn = document.getElementById(`btn-sub-${subTabName}`);
            activeBtn.className = "flex-1 py-1 rounded text-emerald-400 bg-slate-800";
        }

        function saveNotes(type) {
            const val = document.getElementById(`notes-${type}`).value;
            localStorage.setItem(`dig_notes_${type}`, val);
        }

        function loadNotes() {
            ['medica', 'tecnologica'].forEach(type => {
                const saved = localStorage.getItem(`dig_notes_${type}`);
                if (saved) document.getElementById(`notes-${type}`).value = saved;
            });
        }

        function addGlossaryTerm() {
            const termEl = document.getElementById('gloss-term');
            const transEl = document.getElementById('gloss-trans');
            if (!termEl.value.trim() || !transEl.value.trim()) return;

            glossaryList.unshift({ term: termEl.value.trim(), trans: transEl.value.trim() });
            localStorage.setItem('dig_glossary_list', JSON.stringify(glossaryList));
            termEl.value = ''; transEl.value = '';
            renderGlossary();
        }

        function removeGlossaryTerm(index) {
            glossaryList.splice(index, 1);
            localStorage.setItem('dig_glossary_list', JSON.stringify(glossaryList));
            renderGlossary();
        }

        function renderGlossary() {
            const container = document.getElementById('glossary-list');
            container.innerHTML = '';
            if(glossaryList.length === 0) {
                container.innerHTML = `<div class="text-slate-500 text-xs italic text-center py-4">Nessun termine salvato</div>`;
                return;
            }
            glossaryList.forEach((item, idx) => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-2 rounded text-xs">
                        <div>
                            <span class="font-bold text-emerald-400 block">${item.term}</span>
                            <span class="text-slate-400 text-[11px]">${item.trans}</span>
                        </div>
                        <button onclick="removeGlossaryTerm(${idx})" class="text-red-400 font-bold px-2">✕</button>
                    </div>
                `;
            });
        }

        function addCarbItem() {
            const foodEl = document.getElementById('cho-food');
            const valEl = document.getElementById('cho-val');
            if (!foodEl.value.trim() || !valEl.value) return;

            choList.unshift({ food: foodEl.value.trim(), val: parseFloat(valEl.value) });
            localStorage.setItem('dig_cho_list', JSON.stringify(choList));
            foodEl.value = ''; valEl.value = '';
            renderCHO();
        }

        function removeCarbItem(index) {
            choList.splice(index, 1);
            localStorage.setItem('dig_cho_list', JSON.stringify(choList));
            renderCHO();
        }

        function renderCHO() {
            const tbody = document.getElementById('cho-table-body');
            tbody.innerHTML = '';
            if(choList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-slate-500 text-xs italic text-center py-4">Nessun alimento inserito</td></tr>`;
                return;
            }
            choList.forEach((item, idx) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-900/50">
                        <td class="p-2 font-medium text-slate-200">${item.food}</td>
                        <td class="p-2 text-right font-mono text-emerald-400 font-bold">${item.val} g</td>
                        <td class="p-2 text-center"><button onclick="removeCarbItem(${idx})" class="text-red-400 font-bold">✕</button></td>
                    </tr>
                `;
            });
        }

        // FETCH CON DOPPIO ENDPOINT (/sgv.json E /pebble) PER IOB
        async function fetchCareLinkData() {
            if (isFetching) return;
            isFetching = true;

            const syncEl = document.getElementById('last-sync');
            if (syncEl) syncEl.innerText = "Sincronizzazione...";

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            try {
                const [sgvResponse, pebbleResponse] = await Promise.allSettled([
                    fetch('http://127.0.0.1:17580/sgv.json?count=288', { signal: controller.signal, cache: 'no-store' }),
                    fetch('http://127.0.0.1:17580/pebble', { signal: controller.signal, cache: 'no-store' })
                ]);

                clearTimeout(timeoutId);

                let currentIob = null;
                if (pebbleResponse.status === 'fulfilled' && pebbleResponse.value.ok) {
                    const pebbleData = await pebbleResponse.value.json();
                    if (pebbleData && pebbleData.bgs && pebbleData.bgs.length > 0) {
                        const iobVal = pebbleData.bgs[0].iob;
                        if (iobVal !== undefined && iobVal !== null) {
                            currentIob = parseFloat(iobVal).toFixed(1);
                        }
                    }
                }

                if (sgvResponse.status === 'fulfilled' && sgvResponse.value.ok) {
                    const data = await sgvResponse.value.json();
                    
                    if (data && data.length > 0) {
                        bgHistory = data.map(item => {
                            let date = new Date(item.date);
                            let dateStr = `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
                            let timeStr = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                            let trendWord = "FLAT";
                            if (item.direction === "DoubleUp" || item.direction === "SingleUp" || item.direction === "FortyFiveUp") trendWord = "UP";
                            if (item.direction === "DoubleDown" || item.direction === "SingleDown" || item.direction === "FortyFiveDown") trendWord = "DOWN";

                            return { 
                                date: dateStr, 
                                time: timeStr, 
                                value: item.sgv, 
                                trend: trendWord, 
                                rawDate: date,
                                iob: currentIob !== null ? currentIob : (item.iob ? parseFloat(item.iob).toFixed(1) : null),
                                bolus: item.bolus ? 400 : null,
                                bolusColor: item.bolusType === 'manual' ? '#06b6d4' : '#c026d3',
                                meal: item.mb ? 50 : null
                            };
                        }).reverse();

                        try {
                            localStorage.setItem('dig_bgHistory', JSON.stringify(bgHistory));
                        } catch(e) {}
                        
                        checkAlerts();
                        updateUI();
                        
                        let oraAttuale = new Date();
                        if (syncEl) syncEl.innerText = `Aggiornato: ${String(oraAttuale.getHours()).padStart(2,'0')}:${String(oraAttuale.getMinutes()).padStart(2,'0')}`;
                    }
                }
            } catch (err) {
                if (syncEl) syncEl.innerText = "Offline (xDrip)";
                if (bgHistory.length > 0) updateUI();
            } finally {
                isFetching = false;
            }
        }

        function checkAlerts() {
            if (bgHistory.length < 4) return;
            const current = bgHistory[bgHistory.length - 1].value;
            
            if (current < 70) {
                triggerAlert(`ATTENZIONE: IPOGLICEMIA A ${current} mg/dL!`);
            } else if (current > 180) {
                triggerAlert(`ATTENZIONE: IPERGLICEMIA A ${current} mg/dL!`);
            } else {
                silenceAlarm();
            }
        }

        function updateUI() {
            if (bgHistory.length === 0) return;
            const current = bgHistory[bgHistory.length - 1];
            document.getElementById('bg-value').innerText = current.value;
            
            let arrow = "→";
            if (current.trend === "UP") arrow = "↑";
            if (current.trend === "DOWN") arrow = "↓";
            document.getElementById('bg-trend').innerText = arrow;

            // MOSTRA IOB
            const iobEl = document.getElementById('iob-value');
            if (current.iob !== null && current.iob !== undefined) {
                iobEl.innerText = `${current.iob} U`;
            } else {
                iobEl.innerText = `-- U`;
            }

            // TIR 24h
            const nowMs = Date.now();
            const last24hData = bgHistory.filter(item => (nowMs - new Date(item.rawDate).getTime()) <= 24 * 60 * 60 * 1000);
            
            const inRange = last24hData.filter(item => item.value >= 70 && item.value <= 180).length;
            const tir = last24hData.length > 0 ? Math.round((inRange / last24hData.length) * 100) : 0;
            const tirElement = document.getElementById('tir-value');
            tirElement.innerText = `${tir}%`;
            
            if (tir >= 70) tirElement.className = "text-3xl font-black text-emerald-400 font-mono";
            else if (tir >= 50) tirElement.className = "text-3xl font-black text-yellow-500 font-mono";
            else tirElement.className = "text-3xl font-black text-red-500 font-mono";

            // GRAFICO
            const ctx = document.getElementById('bgChart').getContext('2d');
            const labels = bgHistory.map(item => item.time);
            const values = bgHistory.map(item => item.value);
            const bolusValues = bgHistory.map(item => item.bolus || null);
            const bolusColors = bgHistory.map(item => item.bolusColor || '#c026d3');
            const mealValues = bgHistory.map(item => item.meal || null);

            const totalPoints = labels.length;
            const defaultSpan = 48;
            const minIndex = Math.max(0, totalPoints - defaultSpan);
            const maxIndex = totalPoints - 1;

            if (chartInstance) {
                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = values;
                chartInstance.data.datasets[1].data = bolusValues;
                chartInstance.data.datasets[2].data = mealValues;
                
                if (!hasUserScrolled) {
                    chartInstance.scales.x.options.min = minIndex;
                    chartInstance.scales.x.options.max = maxIndex;
                }
                chartInstance.update();
            } else {
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Glicemia',
                                data: values,
                                borderColor: '#ffffff',
                                borderWidth: 2.5,
                                pointBackgroundColor: '#ffffff',
                                pointRadius: 0,
                                pointHoverRadius: 4,
                                tension: 0.25,
                                fill: false,
                                z: 10
                            },
                            {
                                type: 'bar',
                                label: 'Bolo',
                                data: bolusValues,
                                backgroundColor: bolusColors,
                                barThickness: 5,
                                z: 5
                            },
                            {
                                type: 'scatter',
                                label: 'Pasto',
                                data: mealValues,
                                backgroundColor: '#eab308',
                                pointStyle: 'rectRot',
                                pointRadius: 5,
                                z: 5
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { 
                                min: 40, 
                                max: 420, 
                                position: 'right',
                                grid: { color: 'rgba(51, 65, 85, 0.2)' }, 
                                ticks: { 
                                    color: '#94a3b8', 
                                    stepSize: 50,
                                    callback: (val) => (val <= 400 ? val : '')
                                }
                            },
                            x: { 
                                min: minIndex,
                                max: maxIndex,
                                grid: { display: false }, 
                                ticks: { 
                                    color: '#94a3b8', 
                                    maxRotation: 0,
                                    autoSkip: true,
                                    maxTicksLimit: 6
                                } 
                            }
                        },
                        plugins: { 
                            legend: { display: false },
                            zoom: {
                                pan: {
                                    enabled: true,
                                    mode: 'x',
                                    threshold: 2,
                                    onPanStart: () => { hasUserScrolled = true; }
                                }
                            }
                        }
                    },
                    plugins: [{
                        id: 'chartLines',
                        beforeDraw: (chart) => {
                            const ctx = chart.ctx; const y = chart.scales.y; const x = chart.scales.x;
                            ctx.save();
                            ctx.fillStyle = 'rgba(16, 185, 129, 0.15)'; 
                            ctx.fillRect(x.left, y.getPixelForValue(180), x.right - x.left, y.getPixelForValue(70) - y.getPixelForValue(180));
                            
                            const y240 = y.getPixelForValue(240);
                            const y70 = y.getPixelForValue(70);
                            
                            ctx.strokeStyle = '#f97316'; ctx.lineWidth = 1;
                            ctx.beginPath(); ctx.moveTo(x.left, y240); ctx.lineTo(x.right, y240); ctx.stroke();

                            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1;
                            ctx.beginPath(); ctx.moveTo(x.left, y70); ctx.lineTo(x.right, y70); ctx.stroke();
                            ctx.restore();
                        }
                    }]
                });
            }
        }

        function resetTimerQuick(type, defaultDays) {
            const msDays = defaultDays * 24 * 60 * 60 * 1000;
            localStorage.setItem(`dig_expire_${type}`, Date.now() + msDays);
            updateTimers();
        }

        function promptManualTimer(type) {
            const inputGiorni = prompt(`[${type.toUpperCase()}] Quanti GIORNI?`, type === 'sensor' ? "7" : "3");
            if (inputGiorni === null) return;
            const giorni = parseFloat(inputGiorni) || 0;
            if (giorni <= 0) return;

            localStorage.setItem(`dig_expire_${type}`, Date.now() + (giorni * 24 * 60 * 60 * 1000));
            updateTimers();
        }

        function updateTimers() {
            ['sensor', 'set'].forEach(type => {
                const expire = localStorage.getItem(`dig_expire_${type}`);
                if (!expire) { document.getElementById(`${type}-timer`).innerText = "Non impostato"; return; }
                const diff = expire - Date.now();
                if (diff <= 0) {
                    document.getElementById(`${type}-timer`).innerText = "SCADUTO!";
                    document.getElementById(`${type}-timer`).className = "text-xs font-black text-red-500 font-mono block mt-0.5 animate-pulse";
                } else {
                    const days = Math.floor(diff / (24 * 60 * 60 * 1000));
                    const hours = Math.floor((diff % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
                    document.getElementById(`${type}-timer`).innerText = `${days}g ${hours}o`;
                    document.getElementById(`${type}-timer`).className = "text-xs font-black text-emerald-400 font-mono block mt-0.5";
                }
            });
        }

        function triggerAlert(message) {
            const box = document.getElementById('alert-box');
            box.innerText = message;
            box.classList.remove('hidden');
        }

        function silenceAlarm() {
            document.getElementById('alert-box').classList.add('hidden');
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') fetchCareLinkData();
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateTimers();
            loadNotes();
            renderCHO();
            renderGlossary();
            if (bgHistory.length > 0) updateUI();
            
            setInterval(updateTimers, 60000);
            fetchCareLinkData();
            setInterval(fetchCareLinkData, 30000);
        });
    </script>
</body>
</html>
