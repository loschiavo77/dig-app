<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG - Diabetes Intelligence Guide</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22DIG%22,%22short_name%22:%22DIG%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230b132b%22,%22theme_color%22:%22%231c2541%22}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b132b; 
            color: #ffffff; 
            margin: 0; 
            padding: 0;
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }
        .header { 
            background-color: #1c2541; 
            padding: 15px; 
            text-align: center; 
            font-weight: bold; 
            border-bottom: 1px solid #3a506b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title { flex: 1; text-align: center; font-size: 16px; letter-spacing: 1px; color: #00b4d8; }
        .clear-btn {
            background-color: transparent;
            border: 1px solid #3a506b;
            color: #ff4d4d;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .clear-btn:hover { background-color: #ff4d4d; color: #fff; }
        .chat-container { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 8px; 
            max-width: 75%; 
            line-height: 1.4; 
            word-wrap: break-word;
        }
        .user-message { background-color: #00b4d8; align-self: flex-end; color: #000; font-weight: 500; }
        .bot-message { background-color: #1c2541; align-self: flex-start; border: 1px solid #3a506b; }
        .input-area { 
            padding: 15px; 
            background-color: #1c2541; 
            display: flex; 
            gap: 10px; 
            border-top: 1px solid #3a506b; 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #3a506b; 
            background-color: #0b132b; 
            color: #fff; 
            outline: none; 
            font-size: 14px;
        }
        button.send-btn { 
            background-color: #00b4d8; 
            color: #000; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px;
        }
        button.send-btn:hover { background-color: #0096c7; }
    </style>
</head>
<body>

    <div class="header">
        <div style="width: 70px;"></div> <div class="header-title">DIG ASSISTANT INTEL</div>
        <button class="clear-btn" onclick="cancellaCronologia()">Svuota</button>
    </div>
    
    <div class="chat-container" id="chat">
        </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Chiedi a DIG..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Invia</button>
    </div>

    <script>
        // Carica la cronologia salvata o inizia con un array vuoto
        let cronologiaMessaggi = JSON.parse(localStorage.getItem('chat_dig')) || [];

        window.onload = function() {
            const chatContainer = document.getElementById('chat');
            
            if (cronologiaMessaggi.length === 0) {
                // Se la memoria è vuota, mostra il messaggio di benvenuto iniziale
                appendMessage("Ciao! Sono DIG. Chiedimi pure qualsiasi cosa!", 'bot-message', false);
            } else {
                // Altrimenti rigenera tutti i vecchi messaggi salvati dall'utente
                cronologiaMessaggi.forEach(msg => {
                    appendMessage(msg.text, msg.sender, false);
                });
            }
        };

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            // Mostra e salva il messaggio dell'utente
            appendMessage(text, 'user-message', true);
            input.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                
                // Mostra e salva la risposta dell'assistente
                appendMessage(data.reply, 'bot-message', true);
                
                // Fai parlare l'assistente con la voce maschile impostata
                parla(data.reply);
                
            } catch (e) {
                appendMessage("Errore di connessione con il server.", 'bot-message', false);
            }
        }

        function appendMessage(text, className, salva = true) {
            const chat = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = `message ${className}`;
            msg.innerText = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;

            if (salva) {
                cronologiaMessaggi.push({ text: text, sender: className });
                localStorage.setItem('chat_dig', JSON.stringify(cronologiaMessaggi));
            }
        }

        // Sistema di Sintesi Vocale Ottimizzato per Voce Maschile
        function parla(testo) {
            if ('speechSynthesis' in window) {
                // Interrompe riproduzioni precedenti rimaste in coda
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(testo);
                utterance.lang = 'it-IT';
                utterance.rate = 1.0;  // Velocità standard naturale
                utterance.pitch = 0.85; // Abbassa il tono per rendere la voce più maschile

                const voci = window.speechSynthesis.getVoices();
                
                // Algoritmo che cerca la migliore voce italiana ad alta fedeltà
                const voceSelezionata = voci.find(v => {
                    const name = v.name.toLowerCase();
                    return v.lang.startsWith('it') && (
                        name.includes('google') || 
                        name.includes('microsoft') || 
                        name.includes('male') || 
                        name.includes('cosimo') || 
                        name.includes('natural')
                    );
                }) || voci.find(v => v.lang.startsWith('it'));

                if (voceSelezionata) {
                    utterance.voice = voceSelezionata;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {};
        }

        // Funzione legata al pulsante in alto a destra per svuotare la memoria
        function cancellaCronologia() {
            if (confirm("Vuoi davvero svuotare la cronologia dei messaggi?")) {
                localStorage.removeItem('chat_dig');
                cronologiaMessaggi = [];
                document.getElementById('chat').innerHTML = '';
                appendMessage("Ciao! Sono DIG. Chiedimi pure qualsiasi cosa!", 'bot-message', false);
            }
        }
    </script>
</body>
</html>
