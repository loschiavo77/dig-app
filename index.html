<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG - Diabetes Intelligence Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; flex-grow: 1; }
        /* Stile personalizzato per la barra di scorrimento dell'archivio */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen p-4 max-w-md mx-auto">

    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
        <h1 class="text-2xl font-black text-emerald-400 tracking-wider">D.I.G.</h1>
        <span id="last-sync" class="text-xs text-slate-500 font-mono">In attesa...</span>
    </div>

    <div id="tab-archive" class="tab-content justify-between">
        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4 flex flex-col h-[68vh]">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 pb-1 border-b border-slate-800">
                Archivio Storico Glicemie
            </h3>
            <div id="archive-list" class="flex-grow overflow-y-auto space-y-4 pr-1">
                <div class="text-slate-500 text-xs italic text-center py-4">Caricamento dati storici...</div>
            </div>
        </div>
    </div>

    <div id="tab-home" class="tab-content active justify-between">
        <div class="flex justify-between items-center bg-slate-900/30 border border-slate-800/60 p-4 rounded-2xl">
            <div class="text-left">
                <div class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">Glicemia</div>
                <div class="flex items-baseline gap-1">
                    <span id="bg-value" class="text-6xl font-black tracking-tighter text-slate-100">--</span>
                    <span id="bg-trend" class="text-2xl text-emerald-400 font-bold">→</span>
                </div>
            </div>
            
            <div class="text-right border-l border-slate-800 pl-4">
                <div class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">TIR (24h)</div>
                <div class="text-3xl font-black text-emerald-400 font-mono" id="tir-value">--%</div>
                <span class="text-[9px] text-slate-500">Target: 70-180 mg/dL</span>
            </div>
        </div>

        <div id="alert-box" class="mt-3 p-2 rounded bg-red-950/40 border border-red-500/50 text-red-400 text-xs font-bold hidden animate-pulse text-center">
            ATTENZIONE!
        </div>

        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 my-3 flex-grow flex flex-col justify-center min-h-[220px]">
            <canvas id="bgChart"></canvas>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-2">
            <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 text-center flex flex-col justify-between">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-500 tracking-wider block">Scadenza Sensore</span>
                    <span id="sensor-timer" class="text-sm font-black text-emerald-400 font-mono block mt-1">--</span>
                </div>
                <button onclick="promptManualTimer('sensor')" class="text-[9px] text-slate-400 hover:text-slate-200 mt-2 bg-slate-950 border border-slate-800 py-1.5 rounded font-bold">Modifica</button>
            </div>
            <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 text-center flex flex-col justify-between">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-500 tracking-wider block">Scadenza Set</span>
                    <span id="set-timer" class="text-sm font-black text-emerald-400 font-mono block mt-1">--</span>
                </div>
                <button onclick="promptManualTimer('set')" class="text-[9px] text-slate-400 hover:text-slate-200 mt-2 bg-slate-950 border border-slate-800 py-1.5 rounded font-bold">Modifica</button>
            </div>
        </div>
    </div>

    <div id="tab-chat" class="tab-content justify-between h-[68vh]">
        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4 flex flex-col h-full justify-between">
            <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2 border-b border-slate-800 pb-1 flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> DIG Assistant
            </h3>
            <div id="chat-messages" class="flex-grow overflow-y-auto space-y-2 mb-3 text-sm flex flex-col pr-1">
                <div class="bg-slate-900 p-3 rounded-lg max-w-[85%] border border-slate-800 text-slate-300">
                    Ciao! Sono DIG. Leggo i tuoi dati reali da xDrip+. Chiedimi pure consiglio!
                </div>
            </div>
            <div class="flex gap-2">
                <input id="chat-input" type="text" placeholder="Chiedi a DIG..." class="flex-grow bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-200">
                <button onclick="sendMessage()" class="bg-emerald-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm">Invia</button>
            </div>
        </div>
    </div>

    <div class="flex justify-around border-t border-slate-800 pt-3 mt-auto bg-slate-950/80 p-2 rounded-xl">
        <button onclick="switchTab('archive')" class="nav-btn text-slate-500 font-bold text-sm">Archivio</button>
        <button onclick="switchTab('home')" class="nav-btn text-emerald-400 font-bold text-sm">Home</button>
        <button onclick="switchTab('chat')" class="nav-btn text-slate-500 font-bold text-sm">Chat Assistant</button>
    </div>

    <script>
        let bgHistory = [];
        let chartInstance = null;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('text-emerald-400'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.add('text-slate-500'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.remove('text-slate-500');
            event.target.classList.add('text-emerald-400');
        }

        async function fetchCareLinkData() {
            document.getElementById('last-sync').innerText = "Sincronizzazione...";
            try {
                // Leggiamo fino a 288 record per coprire l'intera giornata e oltre
                const response = await fetch('http://127.0.0.1:17580/sgv.json?count=288');
                const data = await response.json();
                
                if (data && data.length > 0) {
                    bgHistory = data.map(item => {
                        let date = new Date(item.date);
                        let dateStr = `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
                        let timeStr = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                        let trendWord = "FLAT";
                        if (item.direction === "DoubleUp" || item.direction === "SingleUp" || item.direction === "FortyFiveUp") trendWord = "UP";
                        if (item.direction === "DoubleDown" || item.direction === "SingleDown" || item.direction === "FortyFiveDown") trendWord = "DOWN";
                        
                        return { date: dateStr, time: timeStr, value: item.sgv, trend: trendWord, rawDate: date };
                    }).reverse();

                    localStorage.setItem('dig_bgHistory', JSON.stringify(bgHistory));
                    
                    const latestBg = bgHistory[bgHistory.length - 1].value;
                    if (latestBg < 70) triggerAlert(`IPOGLICEMIA: ${latestBg} mg/dL!`);
                    else if (latestBg > 180) triggerAlert(`IPERGLICEMIA: ${latestBg} mg/dL!`);
                    else silenceAlarm();

                    updateUI();
                    let oraAttuale = new Date();
                    document.getElementById('last-sync').innerText = `Aggiornato: ${String(oraAttuale.getHours()).padStart(2,'0')}:${String(oraAttuale.getMinutes()).padStart(2,'0')}`;
                }
            } catch (err) {
                document.getElementById('last-sync').innerText = "In attesa di xDrip+...";
            }
        }

        function updateUI() {
            if (bgHistory.length === 0) return;

            // 1. Glicemia Attuale
            const current = bgHistory[bgHistory.length - 1];
            document.getElementById('bg-value').innerText = current.value;
            
            let arrow = "→";
            if (current.trend === "UP") arrow = "↑";
            if (current.trend === "DOWN") arrow = "↓";
            document.getElementById('bg-trend').innerText = arrow;

            // 2. Calcolo TIR
            const inRange = bgHistory.filter(item =>
