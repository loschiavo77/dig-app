<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG - Diabetes Intelligence Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b132b; color: #ffffff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #1c2541; padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #3a506b; }
        .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 75%; line-height: 1.4; }
        .user-message { background-color: #00b4d8; align-self: flex-end; color: #000; }
        .bot-message { background-color: #1c2541; align-self: flex-start; border: 1px solid #3a506b; }
        .input-area { padding: 15px; background-color: #1c2541; display: flex; gap: 10px; border-top: 1px solid #3a506b; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #3a506b; background-color: #0b132b; color: #fff; outline: none; }
        button { background-color: #00b4d8; color: #000; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">DIG ASSISTANT INTEL</div>
    
    <div class="chat-container" id="chat">
        <div class="message bot-message">Ciao! Sono DIG. Chiedimi pure qualsiasi cosa!</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Chiedi a DIG..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclicksendMessage()">Invia</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            input.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                appendMessage(data.reply, 'bot-message');
            } catch (e) {
                appendMessage("Errore di connessione.", 'bot-message');
            }
        }

        function appendMessage(text, className) {
            const chat = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = `message ${className}`;
            msg.innerText = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
