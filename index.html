<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG - Diabetes Intelligence Guide</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22DIG%22,%22short_name%22:%22DIG%22,%22start_url%22:%22/%22,%22id%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%23020617%22,%22theme_color%22:%22%23020617%22}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; flex-grow: 1; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.3); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        
        #chart-container {
            position: relative;
            width: 100%;
            height: 260px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen p-4 max-w-md mx-auto">

    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
        <h1 class="text-2xl font-black text-emerald-400 tracking-wider">D.I.G.</h1>
        <div class="flex items-center gap-2">
            <button id="notif-perm-btn" onclick="requestNotificationPermission()" class="text-[9px] font-mono px-2 py-0.5 rounded border border-slate-700 bg-slate-950 text-slate-400 font-bold">
                Notifiche: OFF
            </button>
            <span id="last-sync" class="text-xs text-slate-500 font-mono">In attesa...</span>
        </div>
    </div>

    <div id="tab-archive" class="tab-content justify-between">
        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4 flex flex-col h-[68vh]">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 pb-1 border-b border-slate-800">
                Archivio Storico Glicemie (fino a 14 Giorni)
            </h3>
            <div id="archive-list" class="flex-grow overflow-y-auto space-y-4 pr-1">
                <div class="text-slate-500 text-xs italic text-center py-4">Caricamento dati storici...</div>
            </div>
        </div>
    </div>

    <div id="tab-home" class="tab-content active justify-between">
        <div class="flex justify-between items-center bg-slate-900/30 border border-slate-800/60 p-4 rounded-2xl">
            <div class="text-left">
                <div class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">Glicemia</div>
                <div class="flex items-baseline gap-1">
                    <span id="bg-value" class="text-6xl font-black tracking-tighter text-slate-100">--</span>
                    <span id="bg-trend" class="text-2xl text-emerald-400 font-bold">→</span>
                </div>
            </div>
            
            <div class="text-right border-l border-slate-800 pl-4">
                <div class="text-slate-500 text-[10px] uppercase tracking-widest font-bold">TIR (Storico)</div>
                <div class="text-3xl font-black text-emerald-400 font-mono" id="tir-value">--%</div>
                <span class="text-[9px] text-slate-500">Target: 70-180 mg/dL</span>
            </div>
        </div>

        <div id="alert-box" class="mt-3 p-2.5 rounded bg-red-950/50 border border-red-500 text-red-400 text-xs font-bold hidden animate-pulse text-center"></div>
        <div id="predictive-alert-box" class="mt-2 p-2.5 rounded bg-yellow-950/40 border border-yellow-600 text-yellow-400 text-xs font-bold hidden text-center border-dashed"></div>

        <div class="flex justify-between items-end px-2 mt-3 text-xs">
            <div></div>
            <div class="text-right">
                <span id="iob-value" class="text-base font-bold text-slate-100 font-mono">-- U</span><br>
                <span class="text-[10px] text-slate-400 uppercase tracking-wider">Insulina attiva</span>
            </div>
        </div>

        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 my-2 flex-grow flex flex-col justify-center min-h-[250px] relative">
            <div id="chart-container">
                <canvas id="bgChart"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-2">
            <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 text-center flex flex-col justify-between">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-500 tracking-wider block">Scadenza Sensore</span>
                    <span id="sensor-timer" class="text-sm font-black text-emerald-400 font-mono block mt-1">--</span>
                </div>
                <div class="flex gap-1 mt-2">
                    <button onclick="resetTimerQuick('sensor', 7)" class="flex-1 text-[9px] text-emerald-400 bg-emerald-950/40 border border-emerald-800/60 py-1.5 rounded font-bold hover:bg-emerald-900/50">
                        +7 Giorni
                    </button>
                    <button onclick="promptManualTimer('sensor')" class="text-[9px] text-slate-400 bg-slate-950 border border-slate-800 px-2 py-1.5 rounded font-bold hover:text-slate-200">
                        ⚙️
                    </button>
                </div>
            </div>

            <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-3 text-center flex flex-col justify-between">
                <div>
                    <span class="text-[10px] uppercase font-bold text-slate-500 tracking-wider block">Scadenza Set</span>
                    <span id="set-timer" class="text-sm font-black text-emerald-400 font-mono block mt-1">--</span>
                </div>
                <div class="flex gap-1 mt-2">
                    <button onclick="resetTimerQuick('set', 3)" class="flex-1 text-[9px] text-emerald-400 bg-emerald-950/40 border border-emerald-800/60 py-1.5 rounded font-bold hover:bg-emerald-900/50">
                        +3 Giorni
                    </button>
                    <button onclick="promptManualTimer('set')" class="text-[9px] text-slate-400 bg-slate-950 border border-slate-800 px-2 py-1.5 rounded font-bold hover:text-slate-200">
                        ⚙️
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-chat" class="tab-content justify-between h-[68vh]">
        <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4 flex flex-col h-full justify-between">
            <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2 border-b border-slate-800 pb-1 flex items-center justify-between">
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> DIG Assistant Intel</span>
                <div class="flex items-center gap-3">
                    <button id="toggle-audio-btn" onclick="toggleAudioOutput()" class="text-[9px] font-mono px-2 py-0.5 rounded border border-slate-700 bg-slate-950 text-slate-400 font-bold transition-colors">
                        Voce: OFF
                    </button>
                    <button onclick="clearChatMemory()" class="text-[9px] text-red-400 font-mono underline opacity-50 hover:opacity-100">Svuota</button>
                </div>
            </h3>
            <div id="chat-messages" class="flex-grow overflow-y-auto space-y-2 mb-3 text-sm flex flex-col pr-1"></div>
            <div class="flex gap-2 items-center">
                <button id="mic-btn" onclick="toggleVoiceInput()" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 p-2.5 rounded-lg text-slate-400 hover:text-emerald-400 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
                    </svg>
                </button>
                <input id="chat-input" type="text" placeholder="Chiedi a DIG..." class="flex-grow bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-200" onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" class="bg-emerald-500 text-slate-950 font-bold px-4 py-2.5 rounded-lg text-sm">Invia</button>
            </div>
        </div>
    </div>

    <div class="flex justify-around border-t border-slate-800 pt-3 mt-auto bg-slate-950/80 p-2 rounded-xl">
        <button onclick="switchTab('archive')" class="nav-btn text-slate-500 font-bold text-sm">Archivio</button>
        <button onclick="switchTab('home')" class="nav-btn text-emerald-400 font-bold text-sm">Home</button>
        <button onclick="switchTab('chat')" class="nav-btn text-slate-500 font-bold text-sm">Chat Assistant</button>
    </div>

    <script>
        let bgHistory = [];
        let chartInstance = null;
        let recognition = null;
        let isListening = false;
        let isAudioEnabled = false;
        let savedChat = [];
        let hasUserScrolled = false;
        let lastNotifiedTime = 0;
        let isFetching = false;

        try {
            savedChat = JSON.parse(localStorage.getItem('dig_chat_history')) || [];
        } catch(e) { 
            savedChat = []; 
        }

        // Recupero ultimo storico salvato se presente
        try {
            const cachedHistory = localStorage.getItem('dig_bgHistory');
            if (cachedHistory) {
                bgHistory = JSON.parse(cachedHistory);
            }
        } catch(e) {}

        // --- SISTEMA AUDIO E NOTIFICHE ---
        function playAudioBeep(freq = 880, type = 'sine', duration = 0.3) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) { console.log("Audio non supportato"); }
        }

        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("Questo browser non supporta le notifiche di sistema. DIG userà gli allarmi acustici integrati.");
                return;
            }
            Notification.requestPermission().then(permission => {
                updateNotificationBtnUI();
                if (permission === "granted") {
                    sendPushNotification("DIG Attivo", "Le notifiche per gli allarmi glicemici sono attive.");
                }
            });
        }

        function updateNotificationBtnUI() {
            const btn = document.getElementById('notif-perm-btn');
            if ("Notification" in window && Notification.permission === "granted") {
                btn.innerText = "Notifiche: ON";
                btn.className = "text-[9px] font-mono px-2 py-0.5 rounded border border-emerald-500 bg-emerald-950/30 text-emerald-400 font-bold";
            } else {
                btn.innerText = "Notifiche: OFF";
                btn.className = "text-[9px] font-mono px-2 py-0.5 rounded border border-slate-700 bg-slate-950 text-slate-400 font-bold";
            }
        }

        function sendPushNotification(title, body) {
            const now = Date.now();
            if (now - lastNotifiedTime < 15 * 60 * 1000 && title !== "DIG Attivo") return;

            playAudioBeep(660, 'sawtooth', 0.4);
            setTimeout(() => playAudioBeep(880, 'sawtooth', 0.4), 450);

            if ("Notification" in window && Notification.permission === "granted") {
                try {
                    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                        navigator.serviceWorker.ready.then(registration => {
                            registration.showNotification(title, {
                                body: body,
                                icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🩸</text></svg>',
                                vibrate: [300, 100, 300, 100, 300]
                            });
                        });
                    } else {
                        new Notification(title, { body: body });
                    }
                } catch(e) { console.log("Errore invio notifica", e); }
            }
            lastNotifiedTime = now;
        }

        function toggleAudioOutput() {
            isAudioEnabled = !isAudioEnabled;
            const btn = document.getElementById('toggle-audio-btn');
            if (isAudioEnabled) {
                btn.innerText = "Voce: ON";
                btn.className = "text-[9px] font-mono px-2 py-0.5 rounded border border-emerald-500 bg-emerald-950/30 text-emerald-400 font-bold transition-colors";
            } else {
                btn.innerText = "Voce: OFF";
                btn.className = "text-[9px] font-mono px-2 py-0.5 rounded border border-slate-700 bg-slate-950 text-slate-400 font-bold transition-colors";
                window.speechSynthesis.cancel();
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window) || !isAudioEnabled) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'it-IT';
            utterance.rate = 0.95;
            utterance.pitch = 0.85;

            const voices = window.speechSynthesis.getVoices();
            let selectedVoice = voices.find(v => v.lang.startsWith('it') && v.name.toLowerCase().includes('google') && !v.name.toLowerCase().includes('female'));
            if (!selectedVoice) selectedVoice = voices.find(v => v.lang.startsWith('it') && (v.name.toLowerCase().includes('cosimo') || v.name.toLowerCase().includes('male')));
            if (!selectedVoice) selectedVoice = voices.find(v => v.lang.startsWith('it'));

            if (selectedVoice) utterance.voice = selectedVoice;
            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { console.log("Voci caricate"); };
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').classList.add('border-emerald-500', 'text-emerald-400', 'animate-pulse');
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('mic-btn').classList.remove('border-emerald-500', 'text-emerald-400', 'animate-pulse');
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('chat-input').value = text;
                sendMessage();
            };
        }

        function toggleVoiceInput() {
            if (!recognition) { alert("Il comando vocale non è supportato su questo dispositivo."); return; }
            if (isListening) recognition.stop(); else recognition.start();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-emerald-400');
                el.classList.add('text-slate-500');
            });
            
            document.getElementById('tab-' + tabName).classList.add('active');
            if(window.event && window.event.target) {
                window.event.target.classList.remove('text-slate-500');
                window.event.target.classList.add('text-emerald-400');
            }

            if (tabName === 'home' && chartInstance) {
                setTimeout(() => {
                    hasUserScrolled = false;
                    const totalPoints = chartInstance.data.labels.length;
                    if (totalPoints > 0) {
                        chartInstance.scales.x.options.min = Math.max(0, totalPoints - 48);
                        chartInstance.scales.x.options.max = totalPoints - 1;
                        chartInstance.update('none');
                    }
                }, 50);
            }
        }

        // --- FETCH CARELINK / XDRIP+ DATI CON TIMEOUT ANTIBLOCCO ---
        async function fetchCareLinkData() {
            if (isFetching) return;
            isFetching = true;

            const syncEl = document.getElementById('last-sync');
            if (syncEl) syncEl.innerText = "Sincronizzazione...";

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000); // 5 secondi di timeout

            try {
                const response = await fetch('http://127.0.0.1:17580/sgv.json?count=4032', {
                    signal: controller.signal,
                    cache: 'no-store'
                });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error("Risposta HTTP non valida");

                const data = await response.json();
                
                if (data && data.length > 0) {
                    bgHistory = data.map(item => {
                        let date = new Date(item.date);
                        let dateStr = `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
                        let timeStr = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                        let trendWord = "FLAT";
                        if (item.direction === "DoubleUp" || item.direction === "SingleUp" || item.direction === "FortyFiveUp") trendWord = "UP";
                        if (item.direction === "DoubleDown" || item.direction === "SingleDown" || item.direction === "FortyFiveDown") trendWord = "DOWN";
                        
                        return { 
                            date: dateStr, 
                            time: timeStr, 
                            value: item.sgv, 
                            trend: trendWord, 
                            rawDate: date,
                            iob: item.iob || null,
                            bolus: item.bolus ? 400 : null,
                            bolusColor: item.bolusType === 'manual' ? '#06b6d4' : '#c026d3',
                            meal: item.mb ? 50 : null
                        };
                    }).reverse();

                    try {
                        localStorage.setItem('dig_bgHistory', JSON.stringify(bgHistory));
                    } catch(e) {}
                    
                    checkRealtimeAndPredictiveAlerts();
                    updateUI();
                    
                    let oraAttuale = new Date();
                    if (syncEl) syncEl.innerText = `Aggiornato: ${String(oraAttuale.getHours()).padStart(2,'0')}:${String(oraAttuale.getMinutes()).padStart(2,'0')}`;
                }
            } catch (err) {
                if (syncEl) syncEl.innerText = "Riconnessione xDrip...";
                // In caso di errore di connessione, visualizza comunque i dati locali memorizzati
                if (bgHistory.length > 0) {
                    updateUI();
                }
            } finally {
                isFetching = false;
            }
        }

        function checkRealtimeAndPredictiveAlerts() {
            if (bgHistory.length < 4) return;
            const current = bgHistory[bgHistory.length - 1].value;
            
            if (current < 70) {
                const msg = `ATTENZIONE: IPOGLICEMIA A ${current} mg/dL!`;
                triggerAlert(msg);
                sendPushNotification("⚠️ IPOGLICEMIA", msg);
            } else if (current > 180) {
                const msg = `ATTENZIONE: IPERGLICEMIA A ${current} mg/dL!`;
                triggerAlert(msg);
                sendPushNotification("⚠️ IPERGLICEMIA", msg);
            } else {
                silenceAlarm();
            }

            const p1 = bgHistory[bgHistory.length - 1].value;
            const p4 = bgHistory[bgHistory.length - 4].value;
            const delta15min = p1 - p4;
            const stimaProssimi15min = p1 + delta15min;

            const predictiveBox = document.getElementById('predictive-alert-box');
            if (stimaProssimi15min < 70 && current >= 70) {
                const msg = `Tendenza in rapida discesa. Rischio ipoglicemia stimato (~${Math.round(stimaProssimi15min)} mg/dL) tra 15 min.`;
                predictiveBox.innerText = `PREDISPOSIZIONE IPO: ${msg}`;
                predictiveBox.classList.remove('hidden');
                sendPushNotification("🔻 PREVISIONE IPO", msg);
            } else if (stimaProssimi15min > 180 && current <= 180) {
                const msg = `Tendenza in rapida salita. Rischio iperglicemia stimato (~${Math.round(stimaProssimi15min)} mg/dL) tra 15 min.`;
                predictiveBox.innerText = `PREDISPOSIZIONE IPER: ${msg}`;
                predictiveBox.classList.remove('hidden');
                sendPushNotification("🔺 PREVISIONE IPER", msg);
            } else {
                predictiveBox.classList.add('hidden');
            }
        }

        // --- RENDER INTERFACCIA E GRAFICO CARELINK ---
        function updateUI() {
            if (bgHistory.length === 0) return;
            const current = bgHistory[bgHistory.length - 1];
            document.getElementById('bg-value').innerText = current.value;
            
            let arrow = "→";
            if (current.trend === "UP") arrow = "↑";
            if (current.trend === "DOWN") arrow = "↓";
            document.getElementById('bg-trend').innerText = arrow;

            if (current.iob !== null && current.iob !== undefined) {
                document.getElementById('iob-value').innerText = `${current.iob} U`;
            } else {
                document.getElementById('iob-value').innerText = `-- U`;
            }

            const inRange = bgHistory.filter(item => item.value >= 70 && item.value <= 180).length;
            const tir = bgHistory.length > 0 ? Math.round((inRange / bgHistory.length) * 100) : 0;
            const tirElement = document.getElementById('tir-value');
            tirElement.innerText = `${tir}%`;
            
            if (tir >= 70) tirElement.className = "text-3xl font-black text-emerald-400 font-mono";
            else if (tir >= 50) tirElement.className = "text-3xl font-black text-yellow-500 font-mono";
            else tirElement.className = "text-3xl font-black text-red-500 font-mono";

            // POPOLAMENTO ARCHIVIO STORICO
            const archiveList = document.getElementById('archive-list');
            archiveList.innerHTML = '';
            const groupedData = {};
            
            [...bgHistory].reverse().forEach(item => {
                let label = item.date;
                const today = new Date();
                const yesterday = new Date();
                yesterday.setDate(today.getDate() - 1);
                
                const itemDateObj = new Date(item.rawDate);
                if (itemDateObj.toDateString() === today.toDateString()) label = "Oggi";
                else if (itemDateObj.toDateString() === yesterday.toDateString()) label = "Ieri";
                else label = item.date.substring(0, 5);

                if (!groupedData[label]) groupedData[label] = [];
                groupedData[label].push(item);
            });

            for (const [giorno, letture] of Object.entries(groupedData)) {
                let groupHTML = `<div class="bg-slate-950/40 border border-slate-800/50 rounded-lg p-3"><h4 class="text-xs font-bold text-emerald-400/90 mb-2 border-b border-slate-800 pb-1">${giorno}</h4><div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">`;
                letture.forEach(item => {
                    let colorClass = "text-emerald-400";
                    if (item.value < 70) colorClass = "text-red-400 font-bold";
                    if (item.value > 180) colorClass = "text-yellow-500 font-bold";
                    groupHTML += `<div class="flex justify-between items-center text-xs"><span class="text-slate-500">${item.time}</span><span class="${colorClass}">${item.value} mg/dL</span></div>`;
                });
                groupHTML += `</div></div>`;
                archiveList.innerHTML += groupHTML;
            }

            // --- CONFIGURAZIONE GRAFICO CARELINK ---
            const ctx = document.getElementById('bgChart').getContext('2d');
            const labels = bgHistory.map(item => item.time);
            const values = bgHistory.map(item => item.value);
            const bolusValues = bgHistory.map(item => item.bolus || null);
            const bolusColors = bgHistory.map(item => item.bolusColor || '#c026d3');
            const mealValues = bgHistory.map(item => item.meal || null);

            const totalPoints = labels.length;
            const defaultSpan = 48; // Ultimi 48 punti (~4 ore)
            const minIndex = Math.max(0, totalPoints - defaultSpan);
            const maxIndex = totalPoints - 1;

            if (chartInstance) {
                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = values;
                chartInstance.data.datasets[1].data = bolusValues;
                chartInstance.data.datasets[2].data = mealValues;
                
                if (!hasUserScrolled) {
                    chartInstance.scales.x.options.min = minIndex;
                    chartInstance.scales.x.options.max = maxIndex;
                }
                chartInstance.update();
            } else {
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Glicemia',
                                data: values,
                                borderColor: '#ffffff',
                                borderWidth: 2.5,
                                pointBackgroundColor: '#ffffff',
                                pointRadius: 0,
                                pointHoverRadius: 4,
                                tension: 0.25,
                                fill: false,
                                z: 10
                            },
                            {
                                type: 'bar',
                                label: 'Bolo',
                                data: bolusValues,
                                backgroundColor: bolusColors,
                                barThickness: 5,
                                z: 5
                            },
                            {
                                type: 'scatter',
                                label: 'Pasto',
                                data: mealValues,
                                backgroundColor: '#eab308',
                                pointStyle: 'rectRot',
                                pointRadius: 5,
                                z: 5
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { 
                                min: 40, 
                                max: 420, 
                                position: 'right',
                                grid: { color: 'rgba(51, 65, 85, 0.2)' }, 
                                ticks: { 
                                    color: '#94a3b8', 
                                    stepSize: 50,
                                    callback: (val) => (val <= 400 ? val : '')
                                }
                            },
                            x: { 
                                min: minIndex,
                                max: maxIndex,
                                grid: { display: false }, 
                                ticks: { 
                                    color: '#94a3b8', 
                                    maxRotation: 0,
                                    autoSkip: true,
                                    maxTicksLimit: 6
                                } 
                            }
                        },
                        plugins: { 
                            legend: { display: false },
                            tooltip: {
                                enabled: true,
                                backgroundColor: '#0f172a',
                                titleFont: { size: 12 },
                                bodyFont: { weight: 'bold', size: 14 },
                                displayColors: false,
                                callbacks: { label: (c) => `Glicemia: ${c.raw} mg/dL alle ${c.label}` }
                            },
                            zoom: {
                                pan: {
                                    enabled: true,
                                    mode: 'x',
                                    threshold: 2,
                                    onPanStart: () => {
                                        hasUserScrolled = true;
                                    }
                                }
                            }
                        }
                    },
                    plugins: [{
                        id: 'chartLines',
                        beforeDraw: (chart) => {
                            const ctx = chart.ctx; const y = chart.scales.y; const x = chart.scales.x;
                            ctx.save();
                            // Fascia Verde Target (70 - 180)
                            ctx.fillStyle = 'rgba(16, 185, 129, 0.15)'; 
                            ctx.fillRect(x.left, y.getPixelForValue(180), x.right - x.left, y.getPixelForValue(70) - y.getPixelForValue(180));
                            
                            // Linee di limite 240 e 70 mg/dL
                            const y240 = y.getPixelForValue(240);
                            const y70 = y.getPixelForValue(70);
                            
                            ctx.strokeStyle = '#f97316'; ctx.lineWidth = 1;
                            ctx.beginPath(); ctx.moveTo(x.left, y240); ctx.lineTo(x.right, y240); ctx.stroke();

                            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1;
                            ctx.beginPath(); ctx.moveTo(x.left, y70); ctx.lineTo(x.right, y70); ctx.stroke();
                            ctx.restore();
                        }
                    }]
                });
            }
        }

        // --- TIMER HARDWARE ---
        function resetTimerQuick(type, defaultDays) {
            const msDays = defaultDays * 24 * 60 * 60 * 1000;
            const expirationTime = Date.now() + msDays;
            
            localStorage.setItem(`dig_expire_${type}`, expirationTime);
            updateTimers();
        }

        function promptManualTimer(type) {
            const inputGiorni = prompt(`[${type.toUpperCase()}] Quanti GIORNI deve durare?`, type === 'sensor' ? "7" : "3");
            if (inputGiorni === null) return;
            
            const inputOre = prompt(`[${type.toUpperCase()}] Quante ORE aggiuntive?`, "0");
            if (inputOre === null) return;

            const giorni = parseFloat(inputGiorni) || 0;
            const ore = parseFloat(inputOre) || 0;

            if (giorni < 0 || ore < 0 || (giorni === 0 && ore === 0)) return;

            const msGiorni = giorni * 24 * 60 * 60 * 1000;
            const msOre = ore * 60 * 60 * 1000;
            const expirationTime = Date.now() + msGiorni + msOre;

            localStorage.setItem(`dig_expire_${type}`, expirationTime);
            updateTimers();
        }

        function updateTimers() {
            ['sensor', 'set'].forEach(type => {
                const expire = localStorage.getItem(`dig_expire_${type}`);
                if (!expire) { document.getElementById(`${type}-timer`).innerText = "Non impostato"; return; }
                const diff = expire - Date.now();
                if (diff <= 0) {
                    document.getElementById(`${type}-timer`).innerText = "SCADUTO!";
                    document.getElementById(`${type}-timer`).className = "text-sm font-black text-red-500 font-mono block mt-1 animate-pulse";
                } else {
                    const days = Math.floor(diff / (24 * 60 * 60 * 1000));
                    const hours = Math.floor((diff % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
                    const mins = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
                    
                    document.getElementById(`${type}-timer`).innerText = `${days}g ${hours}o ${mins}m`;
                    document.getElementById(`${type}-timer`).className = diff < (24 * 60 * 60 * 1000) ? "text-sm font-black text-yellow-500 font-mono block mt-1" : "text-sm font-black text-emerald-400 font-mono block mt-1";
                }
            });
        }

        function triggerAlert(message) {
            const box = document.getElementById('alert-box');
            box.innerText = message;
            box.classList.remove('hidden');
        }

        function silenceAlarm() {
            const box = document.getElementById('alert-box');
            box.classList.add('hidden');
        }

        // --- GESTIONE CHAT ---
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            appendChatMessage('user', message);
            input.value = '';

            savedChat.push({ role: 'user', text: message });
            localStorage.setItem('dig_chat_history', JSON.stringify(savedChat));

            setTimeout(() => {
                const reply = "Ricevuto. Sto elaborando le metriche metaboliche recenti...";
                appendChatMessage('assistant', reply);
                speakText(reply);

                savedChat.push({ role: 'assistant', text: reply });
                localStorage.setItem('dig_chat_history', JSON.stringify(savedChat));
            }, 600);
        }

        function appendChatMessage(role, text) {
            const container = document.getElementById('chat-messages');
            const messageEl = document.createElement('div');
            messageEl.className = role === 'user' ? 'text-right my-1' : 'text-left my-1';
            
            const inner = document.createElement('span');
            inner.className = role === 'user' 
                ? 'inline-block bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 px-3 py-1.5 rounded-lg max-w-[80%]'
                : 'inline-block bg-slate-800 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-lg max-w-[80%]';
            inner.innerText = text;

            messageEl.appendChild(inner);
            container.appendChild(messageEl);
            container.scrollTop = container.scrollHeight;
        }

        function renderSavedChat() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            savedChat.forEach(msg => {
                appendChatMessage(msg.role, msg.text);
            });
        }

        function clearChatMemory() {
            localStorage.removeItem('dig_chat_history');
            savedChat = [];
            document.getElementById('chat-messages').innerHTML = '';
        }

        // AUTO-RECONNETTI QUANDO LA SCHEDA RITORNA ATTIVA
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                fetchCareLinkData();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateNotificationBtnUI();
            updateTimers();
            renderSavedChat();
            if (bgHistory.length > 0) updateUI();
            
            setInterval(updateTimers, 60000);
            
            fetchCareLinkData();
            setInterval(fetchCareLinkData, 30000); // Frequenza a 30 sec per maggior reattività
        });
    </script>
</body>
